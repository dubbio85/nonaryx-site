<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku Nonaryx — Sfida</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1022; color: #e8eaf6; font-family: system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; background: #1a1e38; border-radius: 20px;
    padding: 28px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .logo { font-size: 44px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p.sub { color: #9aa0c3; font-size: 14px; margin: 0 0 20px; }
  [hidden] { display: none !important; }
  button.primary, a.primary {
    display: block; width: 100%; padding: 14px; margin: 8px 0; border: 0; border-radius: 12px;
    background: #4f6df5; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    text-decoration: none;
  }
  .steps { text-align: left; font-size: 13px; color: #9aa0c3; line-height: 1.7; margin: 18px 0 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🧩</div>
  <h1>Sudoku Nonaryx</h1>
  <p class="sub" id="subtitle">Hai ricevuto una sfida!</p>

  <a class="primary" id="openApp" href="#" hidden>Accetta la sfida</a>
  <a class="primary" id="playStore" href="https://play.google.com/store/apps/details?id=com.sudokupulse.app" style="background:#0f9d58">Scarica dal Play Store</a>

  <div class="steps" id="steps"></div>
</div>

<script>
(function () {
  // GitHub Pages serves this file for every missing path. Short challenge
  // links look like /c/<share-id>: resolve the id through the Nonaryx API
  // and hand the full payload to the app via the sudokupulse:// deep link.
  var path = location.pathname || '';
  var match = path.match(/^\/c\/([A-Za-z0-9_-]{4,32})\/?$/);
  if (!match) {
    location.replace('/');
    return;
  }
  var shareId = match[1];
  var it = (navigator.language || 'it').toLowerCase().startsWith('it');
  var subtitle = document.getElementById('subtitle');
  var openApp = document.getElementById('openApp');
  var playStore = document.getElementById('playStore');
  var steps = document.getElementById('steps');

  openApp.textContent = it ? 'Accetta la sfida' : 'Accept this challenge';
  playStore.textContent = it ? 'Scarica dal Play Store' : 'Get it on Google Play';
  subtitle.textContent = it ? 'Hai ricevuto una sfida!' : 'You received a challenge!';
  steps.textContent = it ? 'Caricamento della sfida…' : 'Loading the challenge…';

  // L'app può risolvere l'id da sola: il deep link resta valido anche se
  // questa pagina non riesce a raggiungere l'API.
  var deepById = 'sudokupulse://challenge?id=' + encodeURIComponent(shareId);
  var intentById = 'intent://challenge?id=' + encodeURIComponent(shareId)
    + '#Intent;scheme=sudokupulse;package=com.sudokupulse.app;'
    + 'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.sudokupulse.app')
    + ';end';
  var isAndroid = /Android/i.test(navigator.userAgent);
  openApp.setAttribute('href', isAndroid ? intentById : deepById);
  openApp.hidden = false;

  fetch('https://api.nonaryx.it/shares/' + encodeURIComponent(shareId), { cache: 'no-store' })
    .then(function (resp) {
      if (!resp.ok) throw new Error('not found');
      return resp.json();
    })
    .then(function (body) {
      // Deep link diretto col payload completo: compatibile con tutte le
      // versioni dell'app, anche quelle che non conoscono i link corti.
      var code = body.payload || '';
      var deep = 'sudokupulse://challenge?code=' + encodeURIComponent(code);
      var intentUrl = 'intent://challenge?code=' + encodeURIComponent(code)
        + '#Intent;scheme=sudokupulse;package=com.sudokupulse.app;'
        + 'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.sudokupulse.app')
        + ';end';
      openApp.setAttribute('href', isAndroid ? intentUrl : deep);
      steps.textContent = it
        ? 'Se non hai ancora l\'app, scaricala dal Play Store per accettare la sfida.'
        : 'If you do not have the app yet, get it from Google Play to accept the challenge.';
    })
    .catch(function () {
      subtitle.textContent = it ? 'Link non valido o scaduto' : 'Invalid or expired link';
      steps.textContent = it
        ? 'Chiedi a chi ti ha inviato la sfida di condividerla di nuovo.'
        : 'Ask whoever sent you the challenge to share it again.';
    });
})();
</script>
</body>
</html>
